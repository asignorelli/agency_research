name: Deploy annotation site

on:
  push:
    branches: [main]
    paths:
      - 'experiments/PHA-2026-V3/annotation_site/**'
      - '.github/workflows/annotation-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the site data matches the frozen study sources
        run: |
          python experiments/PHA-2026-V3/annotation_site/build_data.py
          git diff --exit-code -- experiments/PHA-2026-V3/annotation_site/data

      - name: Assemble the static site
        run: |
          mkdir _site
          site=experiments/PHA-2026-V3/annotation_site
          cp "$site/index.html" "$site/app.js" "$site/styles.css" "$site/config.js" _site/
          cp -r "$site/data" _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
